<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141518">
<title>Rep Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231e2024' stroke='%23e04a3a' stroke-width='12'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23141518'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #141518;          /* rubber gym floor */
    --surface: #1e2024;
    --surface-2: #26292e;
    --line: #2e3238;
    --ink: #f2efe9;         /* chalk */
    --muted: #8b8f98;
    --plate-red: #e04a3a;   /* 25 kg plate — Push */
    --plate-blue: #4a76e8;  /* 20 kg plate — Pull */
    --plate-yellow: #e8b32b;/* 15 kg plate — Legs */
    --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 8px 0 2px;
  }
  .tagline { color: var(--muted); font-size: 14px; margin: 0 0 28px; }

  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- Home: day cards ---------- */
  .day-card {
    display: flex; align-items: center; gap: 16px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 14px;
    text-align: left;
    transition: transform 0.06s ease;
  }
  .day-card:active { transform: scale(0.985); }
  .plate {
    flex: none;
    width: 52px; height: 52px; border-radius: 50%;
    border: 7px solid var(--pc, var(--muted));
    background:
      radial-gradient(circle at center, var(--bg) 0 24%, var(--surface-2) 25% 100%);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45);
  }
  .day-card .day-name {
    font-family: var(--display);
    font-weight: 700; font-size: 30px;
    letter-spacing: 0.05em; text-transform: uppercase;
    line-height: 1.05;
  }
  .day-card .day-last { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .day-card .chev { margin-left: auto; color: var(--muted); font-size: 22px; }

  /* ---------- Install banner ---------- */
  .install-banner[hidden] { display: none; }
  .install-banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 14px;
  }
  .install-banner p { margin: 0; flex: 1; color: var(--muted); }
  .install-banner strong { color: var(--ink); font-weight: 600; }
  .install-go {
    flex: none;
    background: var(--plate-red);
    border: none; border-radius: 8px;
    color: var(--ink);
    font-weight: 600; font-size: 14px;
    padding: 9px 16px;
  }
  .install-go:active { opacity: 0.85; }
  .install-x {
    flex: none;
    background: none; border: none;
    color: var(--muted); font-size: 15px;
    padding: 6px;
  }

  .home-tools { display: flex; gap: 10px; margin-top: 26px; }
  .tool-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    padding: 12px;
    font-size: 14px;
  }
  .tool-btn:active { background: var(--surface); }

  /* ---------- Session ---------- */
  .session-head {
    display: flex; align-items: baseline; gap: 12px;
    border-top: 4px solid var(--pc, var(--line));
    padding-top: 14px; margin-bottom: 4px;
  }
  .session-head h2 {
    font-family: var(--display);
    font-weight: 700; font-size: 36px;
    letter-spacing: 0.05em; text-transform: uppercase;
    margin: 0;
    color: var(--pc, var(--ink));
  }
  .session-head .session-date { color: var(--muted); font-size: 14px; }
  .back-btn {
    background: none; border: none;
    color: var(--muted); font-size: 15px;
    padding: 10px 0; margin: 0 0 4px -2px;
  }
  .prefill-note { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 12px;
    margin-bottom: 12px;
  }
  .exercise-top { display: flex; align-items: center; margin-bottom: 10px; }
  .drag-handle {
    background: none; border: none;
    color: var(--muted);
    font-size: 17px; line-height: 1;
    padding: 8px 10px 8px 2px;
    margin: -8px 2px -8px -4px;
    flex: none;
    cursor: grab;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .exercise-card.dragging {
    position: relative; z-index: 5;
    opacity: 0.95;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    border-color: var(--pc, var(--muted));
  }
  .exercise-card.dragging .drag-handle { cursor: grabbing; }
  #exercise-list.drag-active .exercise-card:not(.dragging) { transition: transform 0.15s ease; }
  .exercise-name {
    font-family: var(--display);
    font-weight: 600; font-size: 21px;
    letter-spacing: 0.02em;
    background: none; border: none;
    color: inherit;
    text-align: left;
    padding: 0;
    flex: 1; min-width: 0;
  }
  .exercise-name:active { color: var(--pc, var(--ink)); }
  .icon-btn {
    background: none; border: none;
    color: var(--muted);
    font-size: 20px; line-height: 1;
    padding: 8px 10px;
    margin: -8px -10px -8px auto;
  }
  .set-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px;
  }
  .set-label { color: var(--muted); font-size: 13px; width: 44px; flex: none; }
  .set-row input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-size: 17px;
    padding: 10px 10px;
    text-align: center;
    min-width: 0;
  }
  .set-row input:focus { outline: 2px solid var(--pc, var(--muted)); outline-offset: -1px; border-color: transparent; }
  .set-row input::placeholder { color: #5b5f68; }
  .set-x { color: var(--muted); flex: none; }
  .set-tick {
    flex: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: none;
    color: transparent;
    font-size: 16px; line-height: 1;
    padding: 0;
  }
  .set-row.done .set-tick {
    background: var(--pc, var(--ink));
    border-color: var(--pc, var(--ink));
    color: #101114;
  }
  .set-row.done input { opacity: 0.5; }
  .set-hint {
    color: #5b5f68;
    font-size: 12px;
    margin: -6px 0 8px 52px;
  }
  .set-remove {
    background: none; border: none;
    color: var(--muted); font-size: 18px;
    padding: 6px 8px; flex: none;
  }
  .add-set-btn {
    background: none;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    width: 100%; padding: 9px;
    margin-top: 2px;
  }
  .add-set-btn:active { background: var(--surface-2); }

  /* ---------- Aux cards: gym time, warm-up, stretch ---------- */
  .aux-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .time-card { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .clock-cell { display: flex; flex-direction: column; gap: 8px; }
  .aux-label {
    color: var(--muted); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .clock-btn {
    background: var(--surface-2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-size: 15px;
    padding: 12px 8px;
  }
  .clock-btn:active { background: var(--bg); }
  .time-card input[type="time"] {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    color-scheme: dark;
    font-size: 17px;
    padding: 9px 10px;
    width: 100%;
    text-align: center;
  }
  .duration-note { grid-column: 1 / -1; color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  .aux-head { margin-bottom: 10px; }
  .aux-title {
    font-family: var(--display);
    font-weight: 600; font-size: 21px;
    letter-spacing: 0.02em;
  }
  .warmup-row, .stretch-row { display: flex; gap: 8px; }
  .aux-card textarea {
    display: block;
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    padding: 10px;
    resize: vertical;
    min-height: 52px;
  }
  .warmup-row input, .stretch-row input {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-size: 16px;
    padding: 10px;
    min-width: 0;
  }
  .warmup-row input:first-child { flex: 2.2; }
  .warmup-row input:last-child { flex: 1; text-align: center; }
  .chip {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    font-size: 14.5px;
    padding: 10px 0;
  }
  .chip.active {
    background: var(--pc, var(--ink));
    border-color: var(--pc, var(--ink));
    color: #101114;
    font-weight: 700;
  }
  .stretch-row input { flex: 1; text-align: center; }

  /* ---------- Add exercise ---------- */
  .add-exercise { position: relative; margin-top: 18px; }
  .add-exercise input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--ink);
    font-size: 16px;
    padding: 14px;
  }
  .add-exercise input:focus { outline: 2px solid var(--pc, var(--muted)); outline-offset: -1px; }
  .suggestions {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    z-index: 30;
    box-shadow: 0 12px 28px rgba(0,0,0,0.5);
  }
  .suggestions button {
    display: block; width: 100%;
    background: none; border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-align: left;
    font-size: 15.5px;
    padding: 13px 14px;
  }
  .suggestions button:last-child { border-bottom: none; }
  .suggestions button:active { background: var(--surface); }
  .suggestions .add-new { color: var(--pc, var(--ink)); font-weight: 600; }

  /* ---------- Bottom action bar ---------- */
  .action-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 18px 16px 20px;
    display: none;
  }
  .action-bar.visible { display: block; }
  .action-bar-inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; }
  .btn-primary {
    flex: 1.4;
    background: var(--pc, var(--ink));
    color: #101114;
    border: none; border-radius: 12px;
    font-family: var(--display);
    font-weight: 700; font-size: 20px;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 15px;
  }
  .btn-secondary {
    flex: 1;
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    font-family: var(--display);
    font-weight: 600; font-size: 20px;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 15px;
  }
  .btn-primary:active, .btn-secondary:active { filter: brightness(1.12); }
  .btn-share { flex: 0 0 54px; display: flex; align-items: center; justify-content: center; }
  .btn-share[hidden] { display: none; }

  .empty-note { color: var(--muted); font-size: 14px; text-align: center; margin: 26px 0; }

  /* ---------- Time zone modal ---------- */
  .tz-modal[hidden] { display: none; }
  .tz-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .tz-panel {
    width: 100%; max-width: 480px;
    max-height: 70vh;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .tz-panel input {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    font-size: 16px;
    padding: 12px;
  }
  .tz-list { overflow-y: auto; flex: 1; }
  .tz-list button {
    display: block; width: 100%;
    background: none; border: none;
    border-bottom: 1px solid var(--line);
    color: var(--ink);
    text-align: left;
    font-size: 15px;
    padding: 12px 8px;
  }
  .tz-list button:last-child { border-bottom: none; }
  .tz-list button:active { background: var(--surface-2); }
  .tz-list button.selected { color: var(--plate-yellow); font-weight: 600; }
  .tz-list .tz-abbr { color: var(--muted); font-size: 13px; float: right; }

  /* ---------- History ---------- */
  .history-title {
    font-family: var(--display);
    font-weight: 700; font-size: 36px;
    letter-spacing: 0.05em; text-transform: uppercase;
    margin: 0 0 16px;
  }
  .history-item {
    display: flex; align-items: baseline; gap: 12px;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--pc, var(--line));
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    text-align: left;
  }
  .history-item:active { background: var(--surface-2); }
  .history-day {
    font-family: var(--display);
    font-weight: 700; font-size: 21px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--pc, var(--ink));
    flex: none;
  }
  .history-meta { color: var(--muted); font-size: 14px; }
  .history-log {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0 0 14px;
  }
  .history-actions { display: flex; gap: 10px; }
  .history-actions button {
    flex: 1;
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 15px;
    padding: 13px;
  }
  .history-actions button:active { filter: brightness(1.15); }
  .history-actions .danger { color: var(--plate-red); }

  /* ---------- Resume unfinished session ---------- */
  .resume-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    border: 1px solid var(--pc, var(--line));
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .resume-info { flex: 1; min-width: 0; }
  .resume-title {
    font-family: var(--display);
    font-weight: 700; font-size: 19px;
    letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--pc, var(--ink));
  }
  .resume-meta { color: var(--muted); font-size: 13px; }
  .resume-go {
    flex: none;
    background: var(--pc, var(--ink));
    border: none; border-radius: 8px;
    color: #101114;
    font-weight: 700; font-size: 14px;
    padding: 9px 16px;
  }
  .resume-x {
    flex: none;
    background: none; border: none;
    color: var(--muted); font-size: 15px;
    padding: 6px;
  }

  /* ---------- Calendar ---------- */
  .streak-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .streak-cell {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 6px;
    text-align: center;
  }
  .streak-num {
    display: block;
    font-family: var(--display);
    font-weight: 700; font-size: 30px;
    line-height: 1.1;
  }
  .streak-label {
    color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-size: 18px;
    padding: 4px 14px;
  }
  .cal-title {
    font-family: var(--display);
    font-weight: 600; font-size: 21px;
    letter-spacing: 0.02em;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow {
    color: var(--muted); font-size: 11px;
    text-align: center; padding: 4px 0;
  }
  .cal-cell {
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; border-radius: 8px;
    font-size: 13px; color: var(--muted);
    padding: 0;
  }
  .cal-cell.trained {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
  }
  .cal-cell.today { outline: 1.5px solid var(--muted); outline-offset: -1.5px; }
  .cal-dots { display: flex; gap: 3px; height: 5px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }

  /* ---------- Custom exercise manager ---------- */
  .exlist-row {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .exlist-row:last-child { border-bottom: none; }
  .exlist-name { flex: 1; min-width: 0; font-size: 15.5px; overflow-wrap: anywhere; }
  .exlist-row button {
    flex: none;
    background: none;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    padding: 7px 11px;
  }
  .exlist-row .danger { color: var(--plate-red); }

  /* ---------- Rest timer chip ---------- */
  .rest-chip[hidden] { display: none; }
  .rest-chip {
    position: fixed; left: 50%; bottom: 96px;
    transform: translateX(-50%);
    z-index: 40;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2);
    border: 1.5px solid var(--pc, var(--line));
    border-radius: 999px;
    padding: 8px 10px 8px 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
  #rest-label { color: var(--muted); font-size: 13px; }
  #rest-time {
    font-family: var(--display);
    font-weight: 700; font-size: 22px;
    letter-spacing: 0.03em;
    min-width: 54px; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .rest-chip button {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: inherit;
    font-size: 13px;
    padding: 7px 11px;
  }
  .rest-chip.done {
    background: var(--pc, var(--ink));
    border-color: var(--pc, var(--ink));
    color: #101114;
  }
  .rest-chip.done #rest-label { color: rgba(16,17,20,0.65); }
  .rest-chip.done button { border-color: rgba(16,17,20,0.35); }
  body.rest-visible #toast { bottom: 172px; }
  body.rest-visible #app { padding-bottom: 200px; }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 104px;
    transform: translateX(-50%);
    background: var(--ink); color: #101114;
    font-size: 14.5px; font-weight: 600;
    border-radius: 999px;
    padding: 10px 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  #toast.undoable { pointer-events: auto; }
  .toast-undo {
    background: none; border: none;
    color: inherit;
    font: inherit; font-weight: 800;
    text-decoration: underline;
    padding: 0;
    margin-left: 10px;
  }

  /* ---------- Exercise progress modal ---------- */
  .progress-modal[hidden] { display: none; }
  .progress-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 60;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .progress-panel {
    width: 100%; max-width: 480px;
    max-height: 80vh;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    overflow-y: auto;
  }
  .progress-head { display: flex; align-items: center; }
  .progress-title {
    font-family: var(--display);
    font-weight: 700; font-size: 26px;
    letter-spacing: 0.03em;
    flex: 1; min-width: 0;
    color: var(--pc, var(--ink));
  }
  .progress-best { color: var(--muted); font-size: 14px; margin: 0; }
  .progress-best strong { color: var(--ink); }
  #progress-chart svg { display: block; width: 100%; height: auto; }
  .progress-row {
    display: flex; gap: 10px; align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .progress-row:last-child { border-bottom: none; }
  .progress-date { color: var(--muted); flex: none; width: 96px; }
  .progress-sets { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="action-bar" id="action-bar">

    <button class="btn-secondary btn-share" id="share-btn" hidden aria-label="Share log">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>

<script>
'use strict';

/* ---------------- Data layer ---------------- */

const STORE_KEY = 'replog-data-v1';

const SEED = {
  push: ['Bench Press', 'Incline Dumbbell Press', 'Overhead Press', 'Dumbbell Shoulder Press',
         'Chest Fly', 'Lateral Raise', 'Tricep Pushdown', 'Overhead Tricep Extension', 'Dips', 'Push-ups'],
  pull: ['Lat Pulldown', 'Pull-ups', 'Seated Cable Row', 'Barbell Row', 'Single-arm Dumbbell Row',
         'Face Pull', 'Rear Delt Fly', 'Bicep Curl', 'Hammer Curl', 'Shrugs'],
  legs: ['Squat', 'Leg Press', 'Romanian Deadlift', 'Deadlift', 'Walking Lunges',
         'Leg Extension', 'Leg Curl', 'Hip Thrust', 'Calf Raise', 'Bulgarian Split Squat'],
};

const DAY_META = {
  push: { label: 'Push', color: 'var(--plate-red)' },
  pull: { label: 'Pull', color: 'var(--plate-blue)' },
  legs: { label: 'Legs', color: 'var(--plate-yellow)' },
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d === 'object' && d.customExercises && Array.isArray(d.sessions)) {
        d.settings = normalizeSettings(d.settings);
        d.syncQueue = Array.isArray(d.syncQueue) ? d.syncQueue.filter(x => typeof x === 'string') : [];
        return d;
      }
    }
  } catch (e) { /* fall through to fresh data */ }
  return { customExercises: { push: [], pull: [], legs: [] }, sessions: [], settings: normalizeSettings(null), syncQueue: [] };
}

function normalizeSettings(s) {
  s = s && typeof s === 'object' ? s : {};
  return {
    timeZone: typeof s.timeZone === 'string' ? s.timeZone : null,
    unit: s.unit === 'lb' ? 'lb' : 'kg',
    restSeconds: [0, 60, 90, 120].includes(s.restSeconds) ? s.restSeconds : 90,
    // Token for pushing gym-day counts to lokeshnanda.com (travels with backups)
    syncToken: typeof s.syncToken === 'string' && s.syncToken ? s.syncToken : null,
  };
}

function saveData(d) {
  localStorage.setItem(STORE_KEY, JSON.stringify(d));
}

let data = loadData();

/* ---------------- Session state ---------------- */

// current = { type, id, date, entries: [{ name, sets: [{ weight, reps }] }] }
// weight/reps are strings while editing; cleaned on save/copy.
// current.editing is set when a saved session is re-opened from History.
let current = null;

/* ---------------- Draft autosave ----------------
   The in-progress session is mirrored to localStorage on every change,
   so a tab reload mid-workout loses nothing. The home screen offers to
   resume it; cleared on save or when the user leaves on purpose.
   History edits are excluded: the saved record is their safety net. */

const DRAFT_KEY = 'replog-draft-v1';

function saveDraft() {
  if (!current || current.editing) return;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(current)); } catch (e) { /* storage full, skip */ }
}

function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (d && typeof d === 'object' && DAY_META[d.type] && Array.isArray(d.entries)) return d;
  } catch (e) { /* corrupt draft, ignore */ }
  return null;
}

function clearDraft() {
  localStorage.removeItem(DRAFT_KEY);
}

function draftHasWork(d) {
  return (d.entries || []).some(e => (e.sets || []).some(s => parseInt(s.reps, 10) > 0));
}

function lastSessionOfType(type) {
  for (let i = data.sessions.length - 1; i >= 0; i--) {
    if (data.sessions[i].type === type) return data.sessions[i];
  }
  return null;
}

// Most recent logged sets for an exercise, for the "was 40kg×12" hints.
// Excludes the in-progress session: Copy persists mid-workout, and without
// the exclusion the hint would mirror today's own numbers.
// beforeIndex (optional) limits the scan to sessions before that index,
// so editing an old session shows hints from its past, not its future.
function lastSetsFor(name, beforeIndex) {
  const needle = name.toLowerCase();
  const start = beforeIndex == null || beforeIndex < 0 ? data.sessions.length - 1 : beforeIndex - 1;
  for (let i = start; i >= 0; i--) {
    const rec = data.sessions[i];
    if (current && rec.id === current.id) continue;
    const entry = (rec.entries || []).find(e => e.name.toLowerCase() === needle);
    if (entry) return { sets: entry.sets, unit: rec.unit || 'kg' };
  }
  return null;
}

function startSession(type) {
  const draft = loadDraft();
  if (draft && draftHasWork(draft) &&
      !confirm('Discard the unfinished ' + DAY_META[draft.type].label + ' session and start fresh?')) return;
  clearDraft();
  const last = lastSessionOfType(type);
  const entries = last
    ? last.entries.map(e => ({
        name: e.name,
        sets: e.sets.map(s => ({
          weight: s.weight == null ? '' : String(s.weight),
          reps: s.reps == null ? '' : String(s.reps),
        })),
      }))
    : [];
  current = {
    type,
    id: 'sess-' + Date.now(),
    date: todayISO(),
    entries,   // prev hints attached below, after `current` exists

    prefilledFrom: last ? last.date : null,
    warmup: {
      activity: last && last.warmup && last.warmup.activity ? last.warmup.activity : '',
      minutes: last && last.warmup && last.warmup.minutes != null ? String(last.warmup.minutes) : '',
    },
    stretchMins: last && last.stretch && last.stretch.minutes != null ? String(last.stretch.minutes) : '',
    notes: '',
    clockIn: null,
    clockOut: null,
  };
  current.entries.forEach(e => { e.prev = lastSetsFor(e.name); });
  showSession();
}

function cleanedEntries() {
  const out = [];
  for (const e of current.entries) {
    const sets = [];
    for (const s of e.sets) {
      const reps = parseInt(s.reps, 10);
      if (!reps || reps <= 0) continue;
      const w = parseFloat(s.weight);
      sets.push({ weight: isFinite(w) && w > 0 ? w : null, reps });
    }
    if (sets.length) out.push({ name: e.name, sets });
  }
  return out;
}

// Builds the cleaned, persistable record from the in-progress session.
// Returns null when there is nothing loggable yet.
function buildRecord() {
  const entries = cleanedEntries();
  if (!entries.length) return null;
  const warmMins = parseInt(current.warmup.minutes, 10);
  const stretchMins = parseInt(current.stretchMins, 10);
  return {
    id: current.id, date: current.date || todayISO(), type: current.type, entries,
    warmup: {
      activity: current.warmup.activity.trim() || null,
      minutes: warmMins > 0 ? warmMins : null,
    },
    stretch: { minutes: stretchMins > 0 ? stretchMins : null },
    notes: current.notes.trim() || null,
    clockIn: current.clockIn,
    clockOut: current.clockOut,
    // Edits keep the record's original zone and unit; new sessions use settings.
    timeZone: current.editing && current.timeZone ? current.timeZone : activeZone(),
    unit: current.editing && current.unit ? current.unit : data.settings.unit,
  };
}

function persistRecord(record) {
  const idx = data.sessions.findIndex(s => s.id === record.id);
  if (idx >= 0) data.sessions[idx] = record;
  else data.sessions.push(record);
  queueGymSync(record.date);
  saveData(data);
  flushGymSync(); // fire-and-forget; offline saves stay queued
}

function persistSession() {
  const record = buildRecord();
  if (!record) return false;
  persistRecord(record);
  return true;
}

/* ---------------- Formatting ---------------- */

function todayISO() {
  // en-CA formats as YYYY-MM-DD; use the chosen zone, not device time,
  // so a session near midnight gets the date the lifter's clock-in shows.
  return new Intl.DateTimeFormat('en-CA', { timeZone: activeZone() }).format(new Date());
}

function prettyDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ---------------- Time zone ---------------- */

// CLDR has no English abbreviation for some zones (Intl falls back to "GMT+5:30");
// alias the ones where a familiar abbreviation exists.
const TZ_ABBR = { 'Asia/Kolkata': 'IST', 'Asia/Calcutta': 'IST' };

function deviceZone() {
  return Intl.DateTimeFormat().resolvedOptions().timeZone;
}

function activeZone() {
  return data.settings.timeZone || deviceZone();
}

function zoneAbbr(zone) {
  if (TZ_ABBR[zone]) return TZ_ABBR[zone];
  try {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: zone, timeZoneName: 'short' })
      .formatToParts(new Date());
    return parts.find(p => p.type === 'timeZoneName').value;
  } catch (e) {
    return zone;
  }
}

function nowInZone() {
  return new Intl.DateTimeFormat('en-GB', {
    timeZone: activeZone(), hour: '2-digit', minute: '2-digit', hour12: false,
  }).format(new Date());
}

function gymMinutes(inStr, outStr) {
  const [ih, im] = inStr.split(':').map(Number);
  const [oh, om] = outStr.split(':').map(Number);
  let mins = (oh * 60 + om) - (ih * 60 + im);
  if (mins < 0) mins += 24 * 60; // past midnight
  return mins;
}

function fmtDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h ? h + 'h ' + m + 'm' : m + 'm';
}

// Renders any cleaned session record (today's or historical) as the LLM text.
// Tolerates records saved by older versions that lack newer fields.
function buildLogText(record) {
  const meta = DAY_META[record.type] || { label: record.type };
  const lines = ['Workout Log — ' + meta.label + ' Day — ' + prettyDate(record.date)];

  const clockBits = [];
  const abbr = zoneAbbr(record.timeZone || activeZone());
  if (record.clockIn) clockBits.push('Clock-in: ' + record.clockIn + ' ' + abbr);
  if (record.clockOut) clockBits.push('Clock-out: ' + record.clockOut + ' ' + abbr);
  if (record.clockIn && record.clockOut) {
    clockBits.push('Time in gym: ' + fmtDuration(gymMinutes(record.clockIn, record.clockOut)));
  }
  if (clockBits.length) lines.push(clockBits.join(' · '));
  lines.push('');

  if (record.warmup && (record.warmup.minutes || record.warmup.activity)) {
    const parts = [];
    if (record.warmup.activity) parts.push(record.warmup.activity);
    if (record.warmup.minutes) parts.push(record.warmup.minutes + ' min');
    lines.push('Warm-up: ' + parts.join(' — '));
  }

  const unit = record.unit || 'kg';
  record.entries.forEach((e, i) => {
    const sets = e.sets.map(s => (s.weight != null ? s.weight + unit : 'BW') + '×' + s.reps).join(', ');
    lines.push((i + 1) + '. ' + e.name + ': ' + sets);
  });

  if (record.stretch && record.stretch.minutes) lines.push('Stretch: ' + record.stretch.minutes + ' min');
  if (record.notes) lines.push('Notes: ' + record.notes);

  return lines.join('\n');
}

/* ---------------- Views ---------------- */

const $ = id => document.getElementById(id);
const actionBar = $('action-bar');
const VIEWS = ['view-home', 'view-session', 'view-history', 'view-calendar', 'view-exercises'];

function showView(id) {
  for (const v of VIEWS) $(v).hidden = v !== id;
  actionBar.classList.toggle('visible', id === 'view-session');
  window.scrollTo(0, 0);
}

function showHome() {
  current = null;
  hideRestChip();
  renderDayCards();
  showView('view-home');
}

function renderDayCards() {
  const wrap = $('day-cards');
  wrap.innerHTML = '';

  const draft = loadDraft();
  if (draft) {
    const meta = DAY_META[draft.type];
    const card = document.createElement('div');
    card.className = 'resume-card';
    card.style.setProperty('--pc', meta.color);
    const info = document.createElement('div');
    info.className = 'resume-info';
    const title = document.createElement('div');
    title.className = 'resume-title';
    title.textContent = 'Unfinished ' + meta.label + ' session';
    const sub = document.createElement('div');
    sub.className = 'resume-meta';
    sub.textContent = prettyDate(draft.date || todayISO()) + ' · ' + (draft.entries || []).length + ' exercises';
    info.append(title, sub);
    const go = document.createElement('button');
    go.className = 'resume-go';
    go.textContent = 'Resume';
    go.addEventListener('click', () => { current = draft; showSession(); });
    const x = document.createElement('button');
    x.className = 'resume-x';
    x.setAttribute('aria-label', 'Discard unfinished session');
    x.textContent = '✕';
    x.addEventListener('click', () => {
      if (draftHasWork(draft) && !confirm('Discard the unfinished ' + meta.label + ' session?')) return;
      clearDraft();
      renderDayCards();
    });
    card.append(info, go, x);
    wrap.appendChild(card);
  }

  for (const type of ['push', 'pull', 'legs']) {
    const meta = DAY_META[type];
    const last = lastSessionOfType(type);
    const btn = document.createElement('button');
    btn.className = 'day-card';
    btn.style.setProperty('--pc', meta.color);
    btn.innerHTML =
      '<span class="plate" aria-hidden="true"></span>' +
      '<span><span class="day-name">' + meta.label + '</span><br>' +
      '<span class="day-last">' + (last ? 'Last: ' + prettyDate(last.date) + ' · ' + last.entries.length + ' exercises' : 'No sessions yet') + '</span></span>' +
      '<span class="chev" aria-hidden="true">›</span>';
    btn.addEventListener('click', () => startSession(type));
    wrap.appendChild(btn);
  }
}

function showSession() {
  const meta = DAY_META[current.type];
  $('view-session').style.setProperty('--pc', meta.color);
  actionBar.style.setProperty('--pc', meta.color);
  $('rest-chip').style.setProperty('--pc', meta.color);
  $('session-title').textContent = meta.label + ' Day';
  $('session-date').textContent = prettyDate(current.date || todayISO());
  $('prefill-note').textContent = current.editing
    ? 'Editing this saved session. Finish & Save overwrites it.'
    : current.prefilledFrom
    ? 'Loaded from your last ' + meta.label.toLowerCase() + ' session (' + prettyDate(current.prefilledFrom) + ') — adjust as you go.'
    : 'Fresh start — add your first exercise below.';
  $('add-input').value = '';
  $('warmup-activity').value = current.warmup.activity;
  $('warmup-mins').value = current.warmup.minutes;
  $('stretch-mins').value = current.stretchMins;
  $('notes-input').value = current.notes;
  updateStretchChips();
  updateClockUI();
  hideSuggestions();
  renderExercises();
  showView('view-session');
}

/* ---------------- History ---------------- */

let historyDetailId = null;

function showHistory() {
  historyDetailId = null;
  renderHistory();
  showView('view-history');
}

function renderHistory() {
  const body = $('history-body');
  body.innerHTML = '';

  if (historyDetailId) {
    const rec = data.sessions.find(s => s.id === historyDetailId);
    if (rec) { renderHistoryDetail(body, rec); return; }
    historyDetailId = null;
  }

  const sessions = data.sessions.slice().reverse();
  if (!sessions.length) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = 'No sessions yet — your saved workouts will show up here.';
    body.appendChild(p);
    return;
  }
  for (const rec of sessions) {
    const meta = DAY_META[rec.type] || { label: String(rec.type), color: 'var(--muted)' };
    const item = document.createElement('button');
    item.className = 'history-item';
    item.style.setProperty('--pc', meta.color);
    const day = document.createElement('span');
    day.className = 'history-day';
    day.textContent = meta.label;
    const info = document.createElement('span');
    info.className = 'history-meta';
    const dur = rec.clockIn && rec.clockOut ? ' · ' + fmtDuration(gymMinutes(rec.clockIn, rec.clockOut)) : '';
    info.textContent = prettyDate(rec.date) + ' · ' + (rec.entries || []).length + ' exercises' + dur;
    item.append(day, info);
    item.addEventListener('click', () => { historyDetailId = rec.id; renderHistory(); window.scrollTo(0, 0); });
    body.appendChild(item);
  }
}

function renderHistoryDetail(body, rec) {
  const pre = document.createElement('pre');
  pre.className = 'history-log';
  pre.textContent = buildLogText(rec);
  body.appendChild(pre);

  const actions = document.createElement('div');
  actions.className = 'history-actions';

  const editBtn = document.createElement('button');
  editBtn.textContent = 'Edit';
  editBtn.addEventListener('click', () => editSession(rec));
  actions.appendChild(editBtn);

  const copyBtn = document.createElement('button');
  copyBtn.textContent = 'Copy';
  copyBtn.addEventListener('click', async () => {
    const ok = await copyText(buildLogText(rec));
    toast(ok ? 'Copied' : 'Copy failed — try again');
  });
  actions.appendChild(copyBtn);

  if (navigator.share) {
    const shareBtn = document.createElement('button');
    shareBtn.textContent = 'Share';
    shareBtn.addEventListener('click', () => shareLog(buildLogText(rec)));

  }

  body.appendChild(actions);
}

// Re-opens a saved session in the session editor; Finish & Save overwrites
// it in place, keeping its original id, date, unit, and time zone.
function editSession(rec) {
  const idx = data.sessions.findIndex(s => s.id === rec.id);
  current = {
    type: rec.type,
    id: rec.id,
    date: rec.date,
    editing: true,
    unit: rec.unit || 'kg',
    timeZone: rec.timeZone || activeZone(),
    entries: (rec.entries || []).map(e => ({
      name: e.name,
      sets: e.sets.map(s => ({
        weight: s.weight == null ? '' : String(s.weight),
        reps: s.reps == null ? '' : String(s.reps),
      })),
    })),
    prefilledFrom: null,
    warmup: {
      activity: rec.warmup && rec.warmup.activity ? rec.warmup.activity : '',
      minutes: rec.warmup && rec.warmup.minutes != null ? String(rec.warmup.minutes) : '',
    },
    stretchMins: rec.stretch && rec.stretch.minutes != null ? String(rec.stretch.minutes) : '',
    notes: rec.notes || '',
    clockIn: rec.clockIn || null,
    clockOut: rec.clockOut || null,
  };
  current.entries.forEach(e => { e.prev = lastSetsFor(e.name, idx); });
  showSession();
}

/* ---------------- Consistency calendar ---------------- */

let calYear = 0, calMonth = 0; // calMonth is 0-based

function showCalendar() {
  const [y, m] = todayISO().split('-').map(Number);
  calYear = y;
  calMonth = m - 1;
  renderCalendar();
  showView('view-calendar');
}

function sessionsByDate() {
  const map = new Map();
  for (const s of data.sessions) {
    if (!map.has(s.date)) map.set(s.date, []);
    map.get(s.date).push(s);
  }
  return map;
}

function addDaysISO(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}

function streakStats(byDate) {
  const dates = [...byDate.keys()].sort();
  let longest = 0, run = 0, prev = null;
  for (const d of dates) {
    run = prev && addDaysISO(prev, 1) === d ? run + 1 : 1;
    if (run > longest) longest = run;
    prev = d;
  }
  // Current streak counts back from today, or from yesterday so a streak
  // isn't shown as broken before today's session is logged.
  let cur = 0;
  let d = todayISO();
  if (!byDate.has(d)) d = addDaysISO(d, -1);
  while (byDate.has(d)) { cur++; d = addDaysISO(d, -1); }
  return { current: cur, longest };
}

function renderCalendar() {
  const byDate = sessionsByDate();
  const stats = streakStats(byDate);
  const monthKey = calYear + '-' + String(calMonth + 1).padStart(2, '0');
  let monthDays = 0;
  for (const d of byDate.keys()) if (d.startsWith(monthKey)) monthDays++;

  const row = $('streak-row');
  row.innerHTML = '';
  for (const [num, label] of [[stats.current, 'Day streak'], [stats.longest, 'Best streak'], [monthDays, 'This month']]) {
    const cell = document.createElement('div');
    cell.className = 'streak-cell';
    const n = document.createElement('span');
    n.className = 'streak-num';
    n.textContent = num;
    const l = document.createElement('span');
    l.className = 'streak-label';
    l.textContent = label;
    cell.append(n, l);
    row.appendChild(cell);
  }

  $('cal-title').textContent = new Date(calYear, calMonth, 1)
    .toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  const grid = $('cal-grid');
  grid.innerHTML = '';
  for (const dow of ['M', 'T', 'W', 'T', 'F', 'S', 'S']) {
    const h = document.createElement('div');
    h.className = 'cal-dow';
    h.textContent = dow;
    grid.appendChild(h);
  }
  const offset = (new Date(calYear, calMonth, 1).getDay() + 6) % 7; // Monday-first
  for (let i = 0; i < offset; i++) grid.appendChild(document.createElement('div'));

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = todayISO();
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = monthKey + '-' + String(day).padStart(2, '0');
    const recs = byDate.get(iso);
    const cell = document.createElement(recs ? 'button' : 'div');
    cell.className = 'cal-cell' + (recs ? ' trained' : '') + (iso === today ? ' today' : '');
    const num = document.createElement('span');
    num.textContent = day;
    cell.appendChild(num);
    if (recs) {
      const dots = document.createElement('span');
      dots.className = 'cal-dots';
      for (const type of [...new Set(recs.map(r => r.type))]) {
        const dot = document.createElement('span');
        dot.className = 'cal-dot';
        dot.style.background = (DAY_META[type] || { color: 'var(--muted)' }).color;
        dots.appendChild(dot);
      }
      cell.appendChild(dots);
      cell.setAttribute('aria-label', prettyDate(iso) + ', ' + recs.length + ' session' + (recs.length === 1 ? '' : 's'));
      cell.addEventListener('click', () => {
        historyDetailId = recs[recs.length - 1].id;
        renderHistory();
        showView('view-history');
      });
    }
    grid.appendChild(cell);
  }
}

});

/* ---------------- Rest timer ---------------- */

// Deadline-based (mobile browsers throttle/suspend intervals under lock):
// the interval only re-renders `restEndsAt - now`; the chip catches up via
// visibilitychange when the phone comes back.
let restEndsAt = null, restInterval = null, restNotified = false;

function startRestTimer() {
  const secs = data.settings.restSeconds;
  if (!secs) return;
  restEndsAt = Date.now() + secs * 1000;
  restNotified = false;
  $('rest-chip').hidden = false;
  $('rest-chip').classList.remove('done');
  document.body.classList.add('rest-visible');
  if (!restInterval) restInterval = setInterval(renderRestTimer, 250);
  renderRestTimer();
}

function renderRestTimer() {
  if (restEndsAt == null) return;
  const remain = Math.ceil((restEndsAt - Date.now()) / 1000);
  if (remain <= 0) {
    $('rest-time').textContent = 'Go!';
    $('rest-chip').classList.add('done');
    clearInterval(restInterval);
    restInterval = null;
    if (!restNotified) {
      restNotified = true;
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      setTimeout(() => {
        if (restEndsAt && Date.now() >= restEndsAt) hideRestChip();
      }, 5000);
    }
  } else {
    $('rest-time').textContent = Math.floor(remain / 60) + ':' + String(remain % 60).padStart(2, '0');
  }
}

function hideRestChip() {
  clearInterval(restInterval);
  restInterval = null;
  restEndsAt = null;
  $('rest-chip').hidden = true;
  document.body.classList.remove('rest-visible');
}

$('rest-plus').addEventListener('click', () => {
  if (restEndsAt == null) return;
  restEndsAt = Math.max(restEndsAt, Date.now()) + 30000;
  restNotified = false;
  $('rest-chip').classList.remove('done');
  if (!restInterval) restInterval = setInterval(renderRestTimer, 250);
  renderRestTimer();
});

$('rest-close').addEventListener('click', hideRestChip);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && restEndsAt != null) {
    if (!restInterval && Date.now() < restEndsAt) restInterval = setInterval(renderRestTimer, 250);
    renderRestTimer();
  }
});

const REST_STEPS = [60, 90, 120, 0];

function renderRestButton() {
  const s = data.settings.restSeconds;
  $('rest-btn').textContent = 'Rest timer · ' + (s ? s + 's' : 'Off');
}

$('rest-btn').addEventListener('click', () => {
  const next = REST_STEPS[(REST_STEPS.indexOf(data.settings.restSeconds) + 1) % REST_STEPS.length];
  data.settings.restSeconds = next;
  saveData(data);
  renderRestButton();
  toast(next ? 'Rest timer: ' + next + 's after each ticked set' : 'Rest timer off');
});

function renderExercises() {
  const list = $('exercise-list');
  list.innerHTML = '';
  if (!current.entries.length) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = 'No exercises yet.';

  }
  current.entries.forEach((entry, ei) => {
    const card = document.createElement('div');
    card.className = 'exercise-card';

    const top = document.createElement('div');
    top.className = 'exercise-top';
    const handle = document.createElement('button');
    handle.className = 'drag-handle';
    handle.setAttribute('aria-label', 'Reorder ' + entry.name + ' — drag, or press arrow up/down');
    handle.textContent = '⠿';
    handle.addEventListener('pointerdown', e => startDrag(e, card, ei));
    handle.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && ei > 0) { e.preventDefault(); moveEntry(ei, ei - 1); }
      else if (e.key === 'ArrowDown' && ei < current.entries.length - 1) { e.preventDefault(); moveEntry(ei, ei + 1); }
    });
    const name = document.createElement('button');
    name.className = 'exercise-name';
    name.textContent = entry.name;
    name.setAttribute('aria-label', 'Show progress for ' + entry.name);
    name.addEventListener('click', () => showProgress(entry.name));
    const rm = document.createElement('button');
    rm.className = 'icon-btn';
    rm.setAttribute('aria-label', 'Remove ' + entry.name);
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      const removed = current.entries.splice(ei, 1)[0];
      renderExercises();
      toastUndo('Removed ' + removed.name, () => {
        current.entries.splice(Math.min(ei, current.entries.length), 0, removed);
        renderExercises();
      });
    });
    top.append(handle, name, rm);
    card.appendChild(top);

    entry.sets.forEach((set, si) => {
      const row = document.createElement('div');
      row.className = 'set-row' + (set.done ? ' done' : '');

      const label = document.createElement('span');
      label.className = 'set-label';
      label.textContent = 'Set ' + (si + 1);

      const weight = document.createElement('input');
      weight.type = 'text';
      weight.inputMode = 'decimal';
      weight.placeholder = current.editing && current.unit ? current.unit : data.settings.unit;
      weight.value = set.weight;
      weight.setAttribute('aria-label', entry.name + ' set ' + (si + 1) + ' weight in kg');
      weight.addEventListener('input', () => { set.weight = weight.value; });

      const x = document.createElement('span');
      x.className = 'set-x';
      x.textContent = '×';
      x.setAttribute('aria-hidden', 'true');

      const reps = document.createElement('input');
      reps.type = 'text';
      reps.inputMode = 'numeric';
      reps.placeholder = 'reps';
      reps.value = set.reps;
      reps.setAttribute('aria-label', entry.name + ' set ' + (si + 1) + ' reps');
      reps.addEventListener('input', () => { set.reps = reps.value; });

      const tick = document.createElement('button');
      tick.className = 'set-tick';
      tick.setAttribute('aria-label', 'Mark set ' + (si + 1) + (set.done ? ' not done' : ' done'));
      tick.textContent = '✓';
      tick.addEventListener('click', () => {
        set.done = !set.done;
        if (set.done && !current.editing) startRestTimer();
        renderExercises();
      });

      const rmSet = document.createElement('button');
      rmSet.className = 'set-remove';
      rmSet.setAttribute('aria-label', 'Remove set ' + (si + 1));
      rmSet.textContent = '–';
      rmSet.addEventListener('click', () => {
        const removed = entry.sets.splice(si, 1)[0];
        renderExercises();
        toastUndo('Removed set ' + (si + 1), () => {
          entry.sets.splice(Math.min(si, entry.sets.length), 0, removed);
          renderExercises();
        });
      });

      row.append(label, weight, x, reps, tick, rmSet);
      card.appendChild(row);

      const prevSet = entry.prev && entry.prev.sets[si];
      if (prevSet) {
        const hint = document.createElement('p');
        hint.className = 'set-hint';
        hint.textContent = 'was ' + (prevSet.weight != null ? prevSet.weight + entry.prev.unit : 'BW') + '×' + prevSet.reps;
        card.appendChild(hint);

      entry.sets.push({ weight: prev ? prev.weight : '', reps: prev ? prev.reps : '' });

    list.appendChild(card);

/* ---------------- Reorder exercises ---------------- */

function moveEntry(from, to) {
  const [moved] = current.entries.splice(from, 1);
  current.entries.splice(to, 0, moved);
  renderExercises();
  const h = $('exercise-list').children[to] && $('exercise-list').children[to].querySelector('.drag-handle');
  if (h) h.focus();
}

function startDrag(e, card, from) {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (current.entries.length < 2) return;
  e.preventDefault();
  const handle = e.currentTarget;
  handle.setPointerCapture(e.pointerId);

  const list = $('exercise-list');
  const cards = [...list.querySelectorAll('.exercise-card')];
  // Positions in document coordinates, captured before any transforms are
  // applied — transforms don't change these, so the math stays valid mid-drag.
  const tops = cards.map(c => c.getBoundingClientRect().top + window.scrollY);
  const heights = cards.map(c => c.getBoundingClientRect().height);
  const mids = tops.map((t, i) => t + heights[i] / 2);
  const gap = 12; // .exercise-card margin-bottom
  const step = heights[from] + gap;
  const startY = e.clientY + window.scrollY;

  let to = from;
  let lastClientY = e.clientY;
  let raf = 0;

  card.classList.add('dragging');
  list.classList.add('drag-active');

  function update() {
    const y = lastClientY + window.scrollY;
    card.style.transform = 'translateY(' + (y - startY) + 'px)';
    to = 0;
    for (let i = 0; i < mids.length; i++) {
      if (i !== from && mids[i] < y) to++;
    }
    cards.forEach((c, i) => {
      if (i === from) return;
      if (i > from && i <= to) c.style.transform = 'translateY(' + (-step) + 'px)';
      else if (i < from && i >= to) c.style.transform = 'translateY(' + step + 'px)';
      else c.style.transform = '';
    });
  }

  function tick() {
    const margin = 80, speed = 14;
    if (lastClientY < margin) window.scrollBy(0, -speed * (1 - lastClientY / margin));
    else if (lastClientY > innerHeight - margin) window.scrollBy(0, speed * (1 - (innerHeight - lastClientY) / margin));
    update();
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  function onMove(ev) { lastClientY = ev.clientY; }

  function end(commit) {
    cancelAnimationFrame(raf);
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onCancel);
    cards.forEach(c => { c.style.transform = ''; });
    card.classList.remove('dragging');
    list.classList.remove('drag-active');
    if (commit && to !== from) moveEntry(from, to);
  }

  function onUp() { end(true); }
  function onCancel() { end(false); }

  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onCancel);
}

/* ---------------- Exercise progress ----------------
   Tapping an exercise name in a session opens its history across saved
   sessions: best set, a top-set trend sparkline, and recent sessions.
   Weighted exercises plot top-set weight; pure bodyweight ones plot reps. */

function exerciseHistory(name) {
  const needle = name.toLowerCase();
  const out = [];
  for (const rec of data.sessions) {
    const entry = (rec.entries || []).find(e => e.name.toLowerCase() === needle);
    if (entry) out.push({ date: rec.date, sets: entry.sets, unit: rec.unit || 'kg' });
  }
  return out; // sessions are stored oldest first
}

function topSetOf(sets, weighted) {
  let best = null;
  for (const s of sets) {
    if (weighted && s.weight == null) continue;
    if (!best) { best = s; continue; }
    if (weighted) {
      if (s.weight > best.weight || (s.weight === best.weight && s.reps > best.reps)) best = s;
    } else if (s.reps > best.reps) {
      best = s;
    }
  }
  return best;
}

function fmtSet(s, unit) {
  return (s.weight != null ? s.weight + unit : 'BW') + '×' + s.reps;
}

function sparklineSVG(values, unitLabel) {
  const W = 300, H = 76, P = 10;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const x = i => P + (W - 2 * P) * (values.length === 1 ? 0.5 : i / (values.length - 1));
  const y = v => H - P - (H - 2 * P) * ((v - min) / span);
  const label = v => v + (unitLabel === 'reps' ? ' reps' : unitLabel);
  const pts = values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const last = values.length - 1;
  return '<svg viewBox="0 0 ' + W + ' ' + (H + 16) + '" role="img" aria-label="Top set trend from ' +
    label(min) + ' to ' + label(max) + '">' +
    '<polyline points="' + pts + '" fill="none" stroke="var(--pc, var(--ink))" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    values.map((v, i) =>
      '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="' + (i === last ? 3.5 : 2) + '" fill="var(--pc, var(--ink))"/>'
    ).join('') +
    '<text x="' + P + '" y="' + (H + 12) + '" fill="var(--muted)" font-size="11">min ' + label(min) + '</text>' +
    '<text x="' + (W - P) + '" y="' + (H + 12) + '" fill="var(--muted)" font-size="11" text-anchor="end">max ' + label(max) + '</text>' +
    '</svg>';
}

function showProgress(name) {
  const hist = exerciseHistory(name);
  const modal = $('progress-modal');
  if (current) modal.style.setProperty('--pc', DAY_META[current.type].color);
  $('progress-title').textContent = name;

  const chart = $('progress-chart');
  const list = $('progress-list');
  chart.innerHTML = '';
  list.innerHTML = '';

  if (!hist.length) {
    $('progress-best').textContent = 'No saved sessions with this exercise yet.';
    modal.hidden = false;
    return;
  }

  const weighted = hist.some(h => h.sets.some(s => s.weight != null));
  let bestAll = null, bestWhen = null, bestUnit = 'kg';
  const points = [];
  for (const h of hist) {
    const top = topSetOf(h.sets, weighted);
    if (!top) continue; // a weighted exercise's all-bodyweight day
    points.push(weighted ? top.weight : top.reps);
    const better = !bestAll ||
      (weighted
        ? top.weight > bestAll.weight || (top.weight === bestAll.weight && top.reps > bestAll.reps)
        : top.reps > bestAll.reps);
    if (better) { bestAll = top; bestWhen = h.date; bestUnit = h.unit; }
  }

  const bestEl = $('progress-best');
  bestEl.innerHTML = '';
  if (bestAll) {
    bestEl.appendChild(document.createTextNode('Best: '));
    const strong = document.createElement('strong');
    strong.textContent = fmtSet(bestAll, bestUnit);
    bestEl.appendChild(strong);
    bestEl.appendChild(document.createTextNode(
      ' on ' + prettyDate(bestWhen) + ' · ' + hist.length + ' session' + (hist.length === 1 ? '' : 's')));
  }

  if (points.length > 1) {
    chart.innerHTML = sparklineSVG(points.slice(-20), weighted ? hist[hist.length - 1].unit : 'reps');
  }

  for (const h of hist.slice(-15).reverse()) {
    const row = document.createElement('div');
    row.className = 'progress-row';
    const d = document.createElement('span');
    d.className = 'progress-date';
    d.textContent = prettyDate(h.date);
    const s = document.createElement('span');
    s.className = 'progress-sets';
    s.textContent = h.sets.map(set => fmtSet(set, h.unit)).join(', ');
    row.append(d, s);
    list.appendChild(row);
  }

  modal.hidden = false;
}

$('progress-close').addEventListener('click', () => { $('progress-modal').hidden = true; });
$('progress-modal').addEventListener('click', e => {
  if (e.target === $('progress-modal')) $('progress-modal').hidden = true;
});

/* ---------------- Add exercise ---------------- */

function catalogFor(type) {
  const names = SEED[type].concat(data.customExercises[type] || []);
  return [...new Set(names)];
}

function hideSuggestions() {
  $('suggestions').hidden = true;
}

function renderSuggestions() {
  const box = $('suggestions');
  const q = $('add-input').value.trim();
  const inSession = new Set(current.entries.map(e => e.name.toLowerCase()));
  const catalog = catalogFor(current.type).filter(n => !inSession.has(n.toLowerCase()));
  const matches = (q ? catalog.filter(n => n.toLowerCase().includes(q.toLowerCase())) : catalog).slice(0, 8);
  const exact = catalog.some(n => n.toLowerCase() === q.toLowerCase()) ||
                inSession.has(q.toLowerCase());

  box.innerHTML = '';
  matches.forEach(name => {
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', () => addExercise(name));
    box.appendChild(b);
  });
  if (q && !exact) {
    const b = document.createElement('button');
    b.className = 'add-new';
    b.textContent = '+ Add “' + q + '” as a new exercise';
    b.addEventListener('click', () => {
      data.customExercises[current.type].push(q);
      saveData(data);
      addExercise(q);
    });
    box.appendChild(b);
  }
  box.hidden = box.children.length === 0;
}

function addExercise(name) {
  const idx = current.editing ? data.sessions.findIndex(s => s.id === current.id) : null;
  current.entries.push({ name, sets: [{ weight: '', reps: '' }], prev: lastSetsFor(name, idx) });
  $('add-input').value = '';
  hideSuggestions();
  renderExercises();
}

$('add-input').addEventListener('input', renderSuggestions);
$('add-input').addEventListener('focus', renderSuggestions);
document.addEventListener('click', e => {
  if (!e.target.closest('.add-exercise')) hideSuggestions();
});

/* ---------------- Actions ---------------- */

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('undoable');
  t.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// Undo toast: the action already happened; this offers to reverse it.
// Faster mid-workout than a blocking confirm dialog.
function toastUndo(msg, onUndo) {
  const t = $('toast');
  t.textContent = msg;
  const b = document.createElement('button');
  b.className = 'toast-undo';
  b.textContent = 'Undo';
  b.addEventListener('click', () => {
    t.classList.remove('show', 'undoable');
    clearTimeout(toast._timer);
    onUndo();
  });
  t.appendChild(b);
  t.classList.add('show', 'undoable');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => t.classList.remove('show', 'undoable'), 5000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    ta.remove();
    return ok;
  }
}

async function shareLog(text) {
  try {
    await navigator.share({ text });
  } catch (e) {
    if (e.name !== 'AbortError') toast('Share failed — use Copy instead');
  }
}

$('share-btn').addEventListener('click', () => {
  if (!cleanedEntries().length) {
    toast('Nothing to share — enter some reps first');
    return;
  }
  ensureClockOut();
  const record = buildRecord();
  persistRecord(record);
  renderDayCards();
  shareLog(buildLogText(record));
});

$('copy-btn').addEventListener('click', async () => {
  if (!cleanedEntries().length) {
    toast('Nothing to copy — enter some reps first');
    return;
  }
  ensureClockOut();
  const record = buildRecord();
  persistRecord(record);
  renderDayCards();
  const ok = await copyText(buildLogText(record));
  toast(ok ? 'Copied — paste it to your coach' : 'Copy failed — try again');
});

$('save-btn').addEventListener('click', () => {
  if (cleanedEntries().length) ensureClockOut();
  const wasEditing = current.editing;
  const id = current.id;
  if (!persistSession()) {
    toast('Nothing to save — enter some reps first');
    return;
  }
  if (wasEditing) {
    toast('Session updated');
    backToHistoryDetail(id);
  } else {
    clearDraft();
    toast('Session saved');
    showHome();
  }
});

$('back-btn').addEventListener('click', () => {
  if (current.editing) {
    if (!confirm('Leave without saving your changes?')) return;
    backToHistoryDetail(current.id);
    return;
  }
  const saved = data.sessions.some(s => s.id === current.id);
  if (!saved && cleanedEntries().length &&
      !confirm('Leave without saving? Today’s entries will be lost.')) return;
  clearDraft();
  showHome();
});

/* ---------------- Time zone picker ---------------- */

function renderTzButton() {
  const zone = activeZone();
  const label = data.settings.timeZone
    ? zone + ' (' + zoneAbbr(zone) + ')'
    : 'Auto — ' + zoneAbbr(zone);
  $('tz-btn').textContent = 'Time zone · ' + label;
}

function renderTzList() {
  const list = $('tz-list');
  const q = $('tz-search').value.trim().toLowerCase();
  list.innerHTML = '';

  const addOption = (label, abbr, value, selected) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="tz-abbr"></span>';
    b.insertBefore(document.createTextNode(label), b.firstChild);
    b.querySelector('.tz-abbr').textContent = abbr;
    if (selected) b.classList.add('selected');
    b.addEventListener('click', () => {
      data.settings.timeZone = value;
      saveData(data);
      closeTzModal();
      renderTzButton();
      toast(value ? 'Clock-ins now use ' + zoneAbbr(value) : 'Using device time');
    });
    list.appendChild(b);
  };

  if (!q || 'auto device'.includes(q)) {
    addOption('Auto — use device time (' + deviceZone() + ')', zoneAbbr(deviceZone()), null, !data.settings.timeZone);
  }
  const zones = (typeof Intl.supportedValuesOf === 'function' ? Intl.supportedValuesOf('timeZone') : [deviceZone()])
    .filter(z => z.toLowerCase().includes(q));
  for (const z of zones.slice(0, 50)) {
    addOption(z.replace(/_/g, ' '), zoneAbbr(z), z, data.settings.timeZone === z);
  }
}

function closeTzModal() { $('tz-modal').hidden = true; }

$('tz-btn').addEventListener('click', () => {
  $('tz-modal').hidden = false;
  $('tz-search').value = '';
  renderTzList();
  $('tz-search').focus();
});
$('tz-search').addEventListener('input', renderTzList);
$('tz-modal').addEventListener('click', e => {
  if (e.target === $('tz-modal')) closeTzModal();
});

/* ---------------- Units ---------------- */

function renderUnitButton() {
  $('unit-btn').textContent = 'Units · ' + data.settings.unit;
}

$('unit-btn').addEventListener('click', () => {
  data.settings.unit = data.settings.unit === 'kg' ? 'lb' : 'kg';
  saveData(data);
  renderUnitButton();
  toast('New logs will use ' + data.settings.unit + ' — saved history keeps its unit');
});

/* ---------------- Custom exercise manager ----------------
   Lists user-added exercises per day type with rename and delete.
   Delete only removes the suggestion; past sessions keep the name.
   Rename can optionally update past sessions too, so the "was" hints
   and any future progress views follow the corrected name. */

function showExerciseManager() {
  renderExerciseManager();
  showView('view-exercises');
}

function renderExerciseManager() {
  const body = $('exercises-body');
  body.innerHTML = '';
  let any = false;
  for (const type of ['push', 'pull', 'legs']) {
    const names = data.customExercises[type] || [];
    if (!names.length) continue;
    any = true;
    const card = document.createElement('div');
    card.className = 'aux-card';
    card.style.setProperty('--pc', DAY_META[type].color);
    const head = document.createElement('div');
    head.className = 'aux-head';
    const title = document.createElement('span');
    title.className = 'aux-title';
    title.style.color = 'var(--pc)';
    title.textContent = DAY_META[type].label;
    head.appendChild(title);
    card.appendChild(head);
    names.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'exlist-row';
      const label = document.createElement('span');
      label.className = 'exlist-name';
      label.textContent = name;
      const ren = document.createElement('button');
      ren.textContent = 'Rename';
      ren.addEventListener('click', () => renameCustomExercise(type, i));
      const del = document.createElement('button');
      del.className = 'danger';
      del.textContent = 'Delete';
      del.addEventListener('click', () => {
        if (!confirm('Remove "' + name + '" from suggestions? Past sessions keep it.')) return;
        data.customExercises[type].splice(i, 1);
        saveData(data);
        renderExerciseManager();
        toast('Removed from suggestions');
      });
      row.append(label, ren, del);
      card.appendChild(row);
    });
    body.appendChild(card);
  }
  if (!any) {
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = 'No custom exercises yet. Add one from a session and it shows up here.';
    body.appendChild(p);
  }
}

function historyUses(name) {
  const needle = name.toLowerCase();
  let n = 0;
  for (const s of data.sessions) {
    if ((s.entries || []).some(e => e.name.toLowerCase() === needle)) n++;
  }
  return n;
}

function renameCustomExercise(type, index) {
  const oldName = data.customExercises[type][index];
  const entered = prompt('Rename "' + oldName + '" to:', oldName);
  if (entered === null) return;
  const newName = entered.trim();
  if (!newName || newName === oldName) return;
  // If the new name already exists in the catalog, merge instead of duplicating.
  const existsElsewhere = catalogFor(type)
    .some(n => n.toLowerCase() === newName.toLowerCase() && n.toLowerCase() !== oldName.toLowerCase());
  if (existsElsewhere) data.customExercises[type].splice(index, 1);
  else data.customExercises[type][index] = newName;
  const uses = historyUses(oldName);
  if (uses && confirm('Also rename it in ' + uses + ' past session' + (uses === 1 ? '' : 's') + '? This keeps history and hints consistent.')) {
    const needle = oldName.toLowerCase();
    for (const s of data.sessions) {
      for (const e of s.entries || []) {
        if (e.name.toLowerCase() === needle) e.name = newName;
      }
    }
  }
  saveData(data);
  renderExerciseManager();
  toast('Renamed to ' + newName);
}

$('exercises-btn').addEventListener('click', showExerciseManager);
$('exercises-back').addEventListener('click', showHome);

/* ---------------- Website sync ----------------
   Opt-in: pushes gym DAYS (dates only — never exercises, weights or times)
   to lokeshnanda.com/now via a token-authed Worker endpoint. Saved sessions
   queue locally and flush whenever the app is online. */

const SYNC_URL = 'https://api.lokeshnanda.com/gym';

function queueGymSync(date) {
  if (!data.settings.syncToken || !date) return;
  if (!data.syncQueue.includes(date)) data.syncQueue.push(date);
}

let syncFlushing = false;
async function flushGymSync() {
  if (syncFlushing || !data.settings.syncToken || !data.syncQueue.length) return;
  syncFlushing = true;
  try {
    while (data.syncQueue.length) {
      const date = data.syncQueue[0];
      const res = await fetch(SYNC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, token: data.settings.syncToken }),
      });
      if (res.status === 401) { toast('Website sync token rejected — check Website sync'); break; }
      if (!res.ok) break; // transient — retry next time
      data.syncQueue.shift();
      saveData(data);
    }
  } catch (e) { /* offline — queue stays, retried on next open */ }
  syncFlushing = false;
}

function renderSyncButton() {
  $('sync-btn').textContent = 'Website sync · ' + (data.settings.syncToken ? 'on' : 'off');
}

$('sync-btn').addEventListener('click', () => {
  const entered = prompt(
    'Sync gym days (dates only) to lokeshnanda.com.\nPaste the sync token, or leave blank to turn off:',
    data.settings.syncToken || ''
  );
  if (entered === null) return;
  data.settings.syncToken = entered.trim() || null;
  saveData(data);
  renderSyncButton();
  if (data.settings.syncToken) {
    toast('Website sync on — sessions push automatically');
    flushGymSync();
  } else {
    toast('Website sync off');
  }
});

window.addEventListener('online', flushGymSync);

/* ---------------- Export / import ---------------- */

$('export-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'replog-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
});

$('import-btn').addEventListener('click', () => $('import-file').click());

$('import-file').addEventListener('change', () => {
  const file = $('import-file').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || typeof d !== 'object' || !d.customExercises || !Array.isArray(d.sessions)) {
        throw new Error('bad shape');
      }
      if (!confirm('Replace all data on this device with the backup (' + d.sessions.length + ' sessions)?')) return;
      data = {
        customExercises: {
          push: d.customExercises.push || [],
          pull: d.customExercises.pull || [],
          legs: d.customExercises.legs || [],
        },
        sessions: d.sessions,
        settings: normalizeSettings(d.settings),
        syncQueue: Array.isArray(d.syncQueue) ? d.syncQueue.filter(x => typeof x === 'string') : [],
      };
      saveData(data);
      renderDayCards();
      renderTzButton();
      renderUnitButton();
      renderRestButton();
      renderSyncButton();
      flushGymSync();
      toast('Backup imported');
    } catch (e) {
      toast('That file isn’t a Rep Log backup');
    } finally {
      $('import-file').value = '';
    }
  };
  reader.readAsText(file);
});

/* ---------------- Install prompt ---------------- */

// Browsers never auto-show an install popup; they fire beforeinstallprompt
// and leave it to the page to offer install UI.
const INSTALL_DISMISS_KEY = 'replog-install-dismissed';
let installEvent = null;

function isStandalone() {
  return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}

function showInstallBanner() {
  if (isStandalone() || localStorage.getItem(INSTALL_DISMISS_KEY)) return;
  $('install-banner').hidden = false;
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installEvent = e;
  showInstallBanner();
});

window.addEventListener('appinstalled', () => {
  installEvent = null;
  $('install-banner').hidden = true;
  toast('Rep Log installed — find it on your home screen');
});

$('install-go').addEventListener('click', async () => {
  if (!installEvent) return;
  installEvent.prompt();
  await installEvent.userChoice;
  installEvent = null;
  $('install-banner').hidden = true;
});

$('install-x').addEventListener('click', () => {
  localStorage.setItem(INSTALL_DISMISS_KEY, '1');
  $('install-banner').hidden = true;
});

// iOS Safari never fires beforeinstallprompt — show manual steps instead.
if (/iP(hone|ad|od)/.test(navigator.userAgent) && !isStandalone()) {
  $('install-msg').innerHTML = '<strong>Install Rep Log</strong> — tap the Share button, then “Add to Home Screen”.';
  $('install-go').hidden = true;
  showInstallBanner();
}

/* ---------------- Init ---------------- */

renderTzButton();
renderUnitButton();
renderRestButton();
renderSyncButton();
flushGymSync();
if (navigator.share) $('share-btn').hidden = false;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
showHome();
</script>
